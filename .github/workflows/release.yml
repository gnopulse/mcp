name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-go@v7
        with:
          go-version-file: gnotx/go.mod
          cache-dependency-path: gnotx/go.sum

      - name: Check tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test

      - run: scripts/build-binaries.sh

      # A maintainer approves the run once, on the `npm` environment, before these steps run.
      # The binaries go first: @gnopulse/mcp pins them by exact version.
      - name: Publish gnotx binaries
        run: for dir in npm/*/; do npm publish "$dir" --access public; done

      - name: Publish @gnopulse/mcp
        run: |
          node scripts/pin-binaries.mjs
          npm publish --access public
